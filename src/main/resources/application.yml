server:
  port: 8081
spring:
  profiles:
    active: prd
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    # 针对 Java 8+ LocalDateTime/LocalDate/LocalTime 全局生效
    pattern:
      date-time: yyyy-MM-dd HH:mm:ss
      date: yyyy-MM-dd
      time: HH:mm:ss
    # 容错配置：允许将前端传来的空字符串 "" 自动转为 null（解决日期/对象传 "" 报错问题）
    deserialization:
      ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      add-mappings: false
  aop:
    auto: false
  # cache:
  #   type: jcache
  #   jcache:
  #     config: classpath:ehcache.xml
  #     provider: org.ehcache.jsr107.EhcacheCachingProvider
  liquibase:
    enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: input